[project]
name = "review-pilot"
version = "0.1.0"
description = "Progressive ML, RAG, agent, fine-tuning and MLOps pipeline on customer reviews."
readme = "README.md"
authors = [
    { name = "Clement Rbl", email = "clement.rbl@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=2.0.0",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
]

[project.scripts]
review-pilot = "review_pilot:main"

[build-system]
requires = ["uv_build>=0.10.7,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
    "seaborn>=0.13.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "C4", "PTH", "RUF", "S", "ASYNC", "TRY", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
